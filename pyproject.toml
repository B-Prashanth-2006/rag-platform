[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
description = "A document intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pytesseract>=0.3.10",
    "pillow>=10.4.0",
    "transformers>=5.23.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "faiss-cpu>=1.16.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "testcontainers>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party libraries without complete type annotations
module = [
    "pymupdf.*",
    "docx.*",
    "bs4.*",
    "pytesseract.*",
    "PIL.*",
    "transformers.*",
    "tokenizers.*",
    "faiss.*",
    "chromadb.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymupdf ships unannotated C-extension wrapper functions
module = [
    "rag.ingestion.extractors.pdf",
    "tests.unit.ingestion.conftest",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rag --cov-report=term-missing"
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.coverage.run]
source = ["rag"]
omit = ["*/tests/*"]
