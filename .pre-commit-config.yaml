repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.5.0
          - fastapi>=0.115.0
          - structlog>=24.4.0
          - pytest>=8.3.0
          - httpx>=0.27.0
        args: [--strict, --config-file=pyproject.toml]

